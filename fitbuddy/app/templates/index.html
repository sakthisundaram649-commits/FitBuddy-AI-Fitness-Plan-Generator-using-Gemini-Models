<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitBuddy - AI Workout Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(20,20,30,0.55), rgba(20,20,30,0.55)),
                url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat fixed;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.96);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 24px;
    color: #1a1a2e;
  }
  label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
    color: #333;
    font-size: 0.9rem;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #3355ee;
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: #2643c4; }
  @media (max-width: 480px) {
    .card { padding: 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required />

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" required />

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required />

      <label for="weight">Weight (kg)</label>
      <input type="number" step="0.1" id="weight" name="weight" required />

      <label for="goal">Fitness Goal</label>
      <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, muscle gain" required />

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
